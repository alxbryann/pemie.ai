<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Síncrono e inline a propósito: debe correr antes de pintar cualquier
         cosa para fijar data-theme sin flash (FOUC) de light->dark. Un script
         module/async llegaría tarde, después del primer paint. -->
    <script>
      (function () {
        var THEME_KEY = "pemie-theme";
        var DARK_BG = "#0b1220";
        var LIGHT_BG = "#ffffff";
        try {
          var path = window.location.pathname;
          // Enumeramos las rutas PROTEGIDAS (envueltas en <Protected> en App.tsx),
          // no las públicas: así cualquier ruta desconocida (typo, bookmark viejo)
          // cae del lado seguro (claro), que es también donde el catch-all de
          // React Router termina redirigiendo. Landing/login/registro/invitación
          // tienen diseño propio fijo y no siguen la preferencia del usuario
          // logueado (Layout.tsx la aplica solo dentro del shell autenticado).
          var isProtectedRoute = path === "/app" || path === "/settings" || path.indexOf("/w/") === 0;
          var resolved;
          if (!isProtectedRoute) {
            resolved = "light";
          } else {
            var stored = localStorage.getItem(THEME_KEY);
            // Sin preferencia guardada todavía (primera visita): arranca según
            // el SO. No es una opción elegible en la UI, solo el default inicial.
            var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            resolved = stored === "light" || stored === "dark" ? stored : (prefersDark ? "dark" : "light");
          }
          document.documentElement.setAttribute("data-theme", resolved);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", resolved === "dark" ? DARK_BG : LIGHT_BG);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <meta name="description" content="Tu agente, ascendido a project manager." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>pemie.ai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
